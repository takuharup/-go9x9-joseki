# katago_gtp.cfg
# go9x9-joseki プロジェクト用 KataGo GTP 設定
#
# 9路盤定石探索に最適化した最小構成。
# コマンドライン引数で上書き可能:
#   katago gtp -config data/katago_gtp.cfg -override-config maxVisits=200
#
# ===========================================================================
# ログ
# ===========================================================================

logDir = katago_logs
logAllGTPCommunication = true
logSearchInfo = false
logToStderr = true

# ===========================================================================
# ルール
# ===========================================================================
# 9路盤定石探索には中国ルール（陣地ルール + コミ7目半）が一般的。
# tromp-taylor は厳密なコウルールを持ち、終局処理が明確。

rules = tromp-taylor

# ===========================================================================
# 盤面サイズとコミ
# ===========================================================================
# このプロジェクトは9路盤専用。

boardSize = 9
komi = 7.5

# ===========================================================================
# 探索制限
# ===========================================================================
# maxVisits: 1手あたりの最大訪問数。大きいほど精度が上がるが遅くなる。
# 定石探索では多くの局面を評価するため、初期値は小さめに設定。
# 必要に応じて -override-config maxVisits=<N> で変更する。

maxVisits = 100
# maxTime = 10.0   # 秒数での制限（maxVisits と併用可、先に達した方で打ち切り）

# ===========================================================================
# スレッド数
# ===========================================================================
# numSearchThreads: 探索スレッド数。
# 定石探索では KataGo を複数インスタンス起動することがあるため 1 に設定。
# シングルインスタンスで使う場合は CPU コア数に合わせて増やす。

numSearchThreads = 1

# ===========================================================================
# ニューラルネット推論キャッシュ
# ===========================================================================
# 9路盤は局面数が限られるためキャッシュが有効に機能する。
# 2^20 = 約100万エントリ（メモリ ~500MB 程度）

nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# ===========================================================================
# その他
# ===========================================================================
# パス（投了）の閾値。定石探索中は投了させない。

resignThreshold = -1.0
resignConsecTurns = 3

# ポンダリング（相手番中の先読み）は探索中は不要。
ponderingEnabled = false
